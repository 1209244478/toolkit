<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tabPomodoro">🍅 番茄钟</button>
    <button class="tab-btn" id="tabPet">🐱 宠物</button>
  </div>

  <!-- Pomodoro Panel -->
  <div class="panel" id="pomodoroPanel">
    <div class="container">
      <div class="row">
        <div class="col">
          <label class="label">工作时长 (<span id="workMinVal">25</span> 分钟)</label>
          <input type="range" id="workSlider" class="slider" min="1" max="60" value="25">
        </div>
        <div class="col">
          <label class="label">休息时长 (<span id="breakMinVal">5</span> 分钟)</label>
          <input type="range" id="breakSlider" class="slider" min="1" max="30" value="5">
        </div>
      </div>

      <div class="timer-card">
        <div class="state-label" id="stateLabel">准备开始</div>
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="session-count">已完成 <span id="sessionCount">0</span> 个番茄</div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="btnStart">开始</button>
        <button class="btn btn-outline" id="btnPause" style="display:none">暂停</button>
        <button class="btn btn-outline" id="btnReset">重置</button>
      </div>
    </div>
  </div>

  <!-- Pet Panel -->
  <div class="panel" id="petPanel" style="display:none">
    <!-- Adopt screen (no pet yet) -->
    <div class="pet-adopt" id="petAdopt" style="display:none">
      <div class="pet-adopt-inner">
        <div class="pet-adopt-icon">🐣</div>
        <h3>领养一只宠物</h3>
        <p>完成番茄钟可获得食物来喂养它。<br>记得定时投喂，不然它会饿死的...</p>
        <button class="btn btn-primary btn-adopt" id="btnAdopt">🎲 随机领养</button>
      </div>
    </div>

    <!-- Dead screen -->
    <div class="pet-dead" id="petDead" style="display:none">
      <div class="pet-dead-inner">
        <div class="pet-dead-icon">🪦</div>
        <h3 id="petDeadName">你的宠物饿死了</h3>
        <p>你没能及时喂养它...<br>每个生命只有一次机会。</p>
      </div>
    </div>

    <!-- Pet alive screen -->
    <div class="container" id="petAlive">
      <!-- Pet stage -->
      <div class="pet-stage" id="petStage">
        <img id="petImage" src="" alt="pet" class="pet-img" />
      </div>

      <!-- Pet info -->
      <div class="pet-info">
        <div class="pet-name-type">
          <span class="pet-type-badge" id="petTypeBadge">🐱</span>
          <span class="pet-name" id="petName">小番茄</span>
        </div>
      </div>

      <!-- Status bars -->
      <div class="status-bars">
        <div class="status-row">
          <span class="status-icon" id="hungerIcon">🍖</span>
          <div class="status-bar-wrap">
            <div class="status-bar-fill hunger" id="hungerBar" style="width:100%"></div>
          </div>
          <span class="status-text" id="hungerText">饱饱的</span>
        </div>
        <div class="status-row">
          <span class="status-icon">❤️</span>
          <div class="status-bar-wrap">
            <div class="status-bar-fill happy" id="happyBar" style="width:80%"></div>
          </div>
          <span class="status-text" id="happyText">开心</span>
        </div>
      </div>

      <!-- Food & Actions -->
      <div class="pet-actions">
        <div class="food-info">
          <span class="food-icon" id="foodIcon">🥫</span>
          <span class="food-label" id="foodLabel">食物</span>
          <span class="food-count">: <strong id="foodCount">0</strong></span>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="btnFeed" disabled>喂食</button>
          <button class="btn btn-outline" id="btnPetPet">抚摸</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
